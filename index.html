<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="onde: never-ending ambient, a little sad, generated live in your browser. It never plays the same way twice.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<meta name="claude:viewport-fit-sides" content="cover">
<title>onde</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&display=swap">
<style>
/* Layout: one quiet column, like sempre, lamiera, deriva and nebbia. The porthole is the whole instrument: each line in it is a voice of the piece, tap it to start and stop */
:root{
  --bg:#02040F; --ink:#E5DADA; --mute:#968E96; --line:#152139; --amber:#E59500; --wine:#D2577F; --night:#4A8CC4;
  --font:"Helvetica Neue","IBM Plex Sans",Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-weight:400;font-size:16px;line-height:1.4;font-variant-numeric:tabular-nums;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:16px 28px}
.wrap{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:22px;position:relative;z-index:1}
#room{position:fixed;left:0;bottom:0;width:100%;pointer-events:none;z-index:0;display:block}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

header{display:flex;justify-content:space-between;align-items:baseline}
h1{font-weight:300;font-size:1.5rem;letter-spacing:-.01em;margin:0}
.titleblock{display:flex;flex-direction:column;gap:2px}
.tag{font-size:.78rem;color:var(--mute);letter-spacing:.02em}
#clock{color:var(--mute);font-size:.95rem}

.stage{display:block;width:100%;max-width:min(100%,58vh);aspect-ratio:1;margin:0 auto;position:relative;border-radius:50%;
  -webkit-tap-highlight-color:transparent}
.stage:focus-visible{outline:1px solid var(--amber);outline-offset:3px}
.stage canvas{display:block;width:100%;height:100%}
#tap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-weight:300;font-size:1.9rem;letter-spacing:-.02em;
  color:var(--mute);pointer-events:none}

.cap{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:-6px;text-align:center;min-height:5.2rem}
#nowA{font-weight:300;font-size:1.9rem;letter-spacing:-.02em}
#nowB{color:var(--mute);font-size:.92rem;text-transform:lowercase}
.hint{font-size:.88rem;color:var(--mute);margin:10px auto 0;max-width:40ch;text-align:center}
.foot{display:flex;justify-content:center;gap:10px;padding:10px 16px 0;font-size:.8rem;letter-spacing:.04em;color:var(--mute)}
.foot a{color:inherit;text-decoration:none;border-bottom:1px solid transparent;padding-bottom:1px}
.foot a:hover,.foot a:focus-visible{color:var(--amber);border-bottom-color:currentColor;outline:none}
</style>

</head>
<body>
<canvas id="room" aria-hidden="true"></canvas>
<div class="wrap">
  <header>
    <div class="titleblock">
      <h1>onde</h1>
      <span class="tag">never-ending ambient, a little sad</span>
    </div>
    <span id="clock" hidden>00:00:00</span>
  </header>

  <button class="stage" id="toggle" type="button" aria-pressed="false" aria-label="Start">
    <canvas id="dial" aria-hidden="true"></canvas>
    <span id="tap">tap</span>
  </button>

  <div class="cap">
    <span id="nowA" hidden>f min</span>
    <span id="nowB" hidden>piece 1, bar 1 of 96 at 56 bpm</span>
    <p class="hint" id="hint">Tap the circle. Slow, dark ambient starts, and it never plays the same way twice.</p>
  </div>

  <footer class="foot"><a href="https://github.com/phonk/onde">source on github</a><span aria-hidden="true">·</span><a href="https://phonk.github.io/">phonk</a></footer>
</div>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const chance = p => Math.random() < p;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const KEYS = ['c', 'c♯', 'd', 'e♭', 'e', 'f', 'f♯', 'g', 'a♭', 'a', 'b♭', 'b'];
  /* everything is counted from the root of a minor key, in semitones */
  const VOICINGS = [[0, 7, 15, 22], [0, 7, 10, 15], [-12, 0, 7, 15], [0, 7, 15, 19]];
  const MELS = [[14, 15], [14, 15, 14, 12], [10, 8], [19, 20, 19, 17], [14, 14, 15, 12]];   /* one voice that moves, very slowly */
  const BASS = [[0, 0, -4, -4], [0, 0, 0, -4, 0, 0, -2, -2], [0, -4, -7, -2], [0, 0, -7, -7], [0, 0, 0, 0], [0, 0, -4, -2]];   /* the chord stays, the floor moves under it */
  const SUBPATS = [
    [1, 0, 0, 0, .6, 0, 0, 0, .8, 0, 0, 0, .6, 0, 0, 0],
    [1, 0, .5, 0, .7, 0, .5, 0, .9, 0, .5, 0, .7, 0, .5, 0],
    [1, 0, 0, .5, 0, 0, .7, 0, 0, 0, .6, 0, 0, .5, 0, 0],
    [1, 0, 0, 0, 0, 0, .6, 0, .8, 0, 0, 0, 0, 0, .5, 0]
  ];

  let ac = null, mix, master, tape, bed, noiseBuf, crackleBuf, irBuf;
  let decks = [], cur = 0, curL = 96, curT = 16, pieceNo = 0;
  let step = 0, nextTime = 0, baseBpm = 56, t0 = 0, bpmNow = 56;
  let playing = false, worker = null, fallbackTimer = null, silentEl = null;
  const events = [];

  /* ---------- raw material ---------- */
  function makeNoise(seconds) {
    const b = ac.createBuffer(1, ac.sampleRate * seconds, ac.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return b;
  }
  function makeCrackle(seconds) {
    const b = ac.createBuffer(1, ac.sampleRate * seconds, ac.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() < 0.00035 ? (Math.random() * 2 - 1) : 0;
    return b;
  }
  function makeImpulse(seconds) {
    const sr = ac.sampleRate, n = Math.floor(sr * seconds), b = ac.createBuffer(2, n, sr);
    for (let c = 0; c < 2; c++) {
      const d = b.getChannelData(c); let y = 0;
      for (let i = Math.floor(sr * 0.02); i < n; i++) {
        const t = i / sr, x = (Math.random() * 2 - 1) * Math.exp(-t * 0.72);
        const a = 0.4 * Math.exp(-t * 0.6) + 0.04;   /* the tail gets darker as it dies */
        y += a * (x - y); d[i] = y;
      }
    }
    return b;
  }
  function tanhCurve(k, out) {
    const c = new Float32Array(1025);
    for (let i = 0; i < 1025; i++) c[i] = Math.tanh((i / 512 - 1) * k) * out;
    return c;
  }

  /* ---------- a deck: one piece, with its own echo and room ---------- */
  class Deck {
    constructor(i) {
      this.i = i;
      const g = v => { const n = ac.createGain(); n.gain.value = v; return n; };
      const bq = (type, f, q) => { const n = ac.createBiquadFilter(); n.type = type; n.frequency.value = f; n.Q.value = q; return n; };
      this.g = g; this.bq = bq;
      this.out = g(0); this.lp = bq('lowpass', 16000, 0.5); this.pre = g(1);
      this.pre.connect(this.lp); this.lp.connect(this.out); this.out.connect(mix);
      this.duck = g(1); this.duck.connect(this.pre);

      /* pads go through a wobbling tape before anything else */
      this.padBus = g(1);
      this.warb = ac.createDelay(0.2); this.warb.delayTime.value = 0.03;
      [[rnd(0.3, 0.5), 0.0022], [rnd(0.06, 0.11), 0.005], [rnd(5.5, 7.5), 0.00005]].forEach(([f, d]) => {
        const o = ac.createOscillator(), og = g(d); o.frequency.value = f; o.connect(og); og.connect(this.warb.delayTime); o.start();
      });
      this.padBus.connect(this.warb); this.warb.connect(this.duck);

      this.subBus = g(0.5); this.subBus.connect(this.pre);
      this.pluckBus = g(1); this.pluckBus.connect(this.duck);
      this.pingBus = g(1); { const d = g(0.5); this.pingBus.connect(d); d.connect(this.pre); }

      this.delay = ac.createDelay(4);
      this.delaySend = g(1);
      this.fb = g(0.5);
      const fbHP = bq('highpass', 240, -3); this.fbLP = bq('lowpass', 2000, -3);
      const sat = ac.createWaveShaper(); sat.curve = tanhCurve(2, 0.9);
      const delayOut = g(0.7);
      this.pan = ac.createStereoPanner ? ac.createStereoPanner() : g(1);
      this.delaySend.connect(this.delay);
      this.delay.connect(fbHP); fbHP.connect(this.fbLP); this.fbLP.connect(this.fb); this.fb.connect(sat); sat.connect(this.delay);
      this.delay.connect(delayOut); delayOut.connect(this.pan); this.pan.connect(this.duck);
      if (this.pan.pan) { const o = ac.createOscillator(), og = g(0.6); o.frequency.value = rnd(0.03, 0.07); o.connect(og); og.connect(this.pan.pan); o.start(); }
      { const d = g(0.7); this.pluckBus.connect(d); d.connect(this.delaySend); }
      { const d = g(0.8); this.pingBus.connect(d); d.connect(this.delaySend); }

      this.rev = ac.createConvolver(); this.rev.buffer = irBuf;
      this.revIn = g(1); this.revIn.connect(this.rev);
      { const o = g(0.6); this.rev.connect(o); o.connect(this.pre); }
      [[this.warb, 0.45], [this.pluckBus, 0.5], [this.pingBus, 0.9], [this.delay, 0.4]].forEach(([n, v]) => { const s = g(v); n.connect(s); s.connect(this.revIn); });

      this.track = null; this.voices = []; this.live = [];
    }

    load(tr, bar, t, fadeBars, barDur, first) {
      this.track = tr; this.startBar = bar; this.bn = null; this.mn = null;
      this.pulseFrom = bar + (first ? 8 : fadeBars + pick([0, 4, 8])); this.pulseUntil = Infinity;
      const fade = fadeBars * barDur, o = this.out.gain, f = this.lp.frequency;
      o.cancelScheduledValues(t); o.setValueAtTime(0.0001, t); o.linearRampToValueAtTime(1, t + fade);
      f.cancelScheduledValues(t); f.setValueAtTime(300, t); f.exponentialRampToValueAtTime(16000, t + fade);
      this.delay.delayTime.cancelScheduledValues(t); this.delay.delayTime.setValueAtTime(tr.delaySteps * barDur / 16, t);
      this.fb.gain.setValueAtTime(tr.fb, t); this.fbLP.frequency.setValueAtTime(tr.fbTone, t);
      this.startVoices(t);
    }

    startVoices(t) {
      const tr = this.track, g = this.g, bq = this.bq;
      this.voices = []; this.live = [];
      const notes = tr.voicing.map(n => ({ n, mel: false })).concat([{ n: tr.mel[0], mel: true }]);
      const lv = 0.21 * tr.padLevel / Math.sqrt(notes.length);
      /* every voice of the pad swells and fades on its own clock */
      for (const { n, mel } of notes) {
        const f = bq('lowpass', tr.padCut * (mel ? 1.5 : 1), 0.7), vg = g(lv * 0.55);
        const per = rnd(18, 46), ts = t + rnd(0, per * 0.5);
        const lfo = ac.createOscillator(), lg = g(lv * 0.45); lfo.frequency.value = 1 / per; lfo.connect(lg); lg.connect(vg.gain); lfo.start(ts);
        const oscs = [-1, 1].map(s => {
          const o = ac.createOscillator(); o.type = mel && s > 0 ? 'triangle' : 'sawtooth';
          o.frequency.value = mtof(tr.base + n); o.detune.value = s * rnd(4, 9); o.connect(f); o.start(t); return o;
        });
        f.connect(vg); vg.connect(this.padBus);
        this.voices.push({ n, mel, per, ts, f, oscs });
        this.live.push(lfo, ...oscs);
      }
      /* the floor: a low sine that is always there, and that the pulse pushes */
      this.sub = ac.createOscillator(); this.sub2 = ac.createOscillator();
      const s2 = g(0.2), slp = bq('lowpass', 240, 0.5);
      this.subGain = g(0.1);
      this.sub.connect(this.subGain); this.sub2.connect(s2); s2.connect(this.subGain); this.subGain.connect(slp); slp.connect(this.subBus);
      this.sub.start(t); this.sub2.start(t); this.live.push(this.sub, this.sub2);
      this.subBus.gain.setValueAtTime(0.5 * tr.subLevel, t);
      /* wind, or water, far away */
      if (tr.wind) {
        const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
        const bp = bq('bandpass', tr.windF, 1.5), wg = g(tr.wind * 0.6);
        const lfo = ac.createOscillator(), lg = g(tr.wind * 0.4); lfo.frequency.value = 1 / rnd(15, 40); lfo.connect(lg); lg.connect(wg.gain);
        const fl = ac.createOscillator(), flg = g(tr.windF * 0.4); fl.frequency.value = 1 / rnd(20, 50); fl.connect(flg); flg.connect(bp.frequency);
        src.connect(bp); bp.connect(wg); wg.connect(this.pre); wg.connect(this.revIn);
        src.start(t, Math.random()); lfo.start(t); fl.start(t); this.live.push(src, lfo, fl);
      }
    }

    beginOut(bar, t, fadeBars, barDur) {
      this.pulseUntil = bar + Math.floor(fadeBars / 4);
      const d = fadeBars * barDur, o = this.out.gain, f = this.lp.frequency;
      o.cancelScheduledValues(t); o.setValueAtTime(1, t); o.linearRampToValueAtTime(0.85, t + d * 0.4); o.linearRampToValueAtTime(0.0001, t + d);
      f.cancelScheduledValues(t); f.setValueAtTime(16000, t); f.exponentialRampToValueAtTime(400, t + d);
    }
    end(t) {
      this.live.forEach(n => { try { n.stop(t + 0.5); } catch (e) {} });
      this.live = []; this.voices = []; this.track = null;
    }

    playStep(bar, s, t, sd) {
      const tr = this.track; if (!tr) return;
      const rb = bar - this.startBar;
      if (s === 0) {
        let bn = tr.bassBase + tr.bass[Math.floor(rb / 4) % tr.bass.length]; if (bn < 29) bn += 12;
        if (bn !== this.bn) {
          const first = this.bn === null; this.bn = bn;
          if (first) { this.sub.frequency.setValueAtTime(mtof(bn), t); this.sub2.frequency.setValueAtTime(mtof(bn + 12), t); }
          else { this.sub.frequency.setTargetAtTime(mtof(bn), t, 0.15); this.sub2.frequency.setTargetAtTime(mtof(bn + 12), t, 0.15); }
        }
        const mn = tr.mel[Math.floor(rb / tr.melBars) % tr.mel.length];
        if (mn !== this.mn) {
          this.mn = mn;
          const v = this.voices.find(x => x.mel);
          if (v) { v.n = mn; v.oscs.forEach(o => o.frequency.setTargetAtTime(mtof(tr.base + mn), t, 0.35)); }
        }
        const drift = Math.pow(2, 0.5 * Math.sin(t / tr.p2) + 0.25 * Math.sin(t / tr.p1 + 1));
        this.voices.forEach(v => v.f.frequency.setTargetAtTime(tr.padCut * (v.mel ? 1.5 : 1) * drift, t, 1.5));
        this.delay.delayTime.setTargetAtTime(tr.delaySteps * sd, t, 0.8);
        this.fbLP.frequency.setTargetAtTime(clamp(tr.fbTone * drift, 700, 3600), t, 1);
      }
      const on = tr.hasPulse && bar >= this.pulseFrom && bar < this.pulseUntil && !tr.breaks.has(rb);
      if (on && tr.subPat[s] > 0) this.pulse(t, tr.subPat[s], tr);
      if (on && tr.pluck && tr.pluckPat[s] > 0 && chance(0.85)) this.pluck(t, tr.pluckPat[s] * tr.pluck, tr);
      if (s % 2 === 0 && chance(tr.ping)) this.ping(t, tr);
      if (tr.tick && chance(tr.tick)) this.tick(t);
    }

    pulse(t, vel, tr) {
      const gn = this.subGain.gain;
      gn.setTargetAtTime(0.1 + 0.8 * vel, t, 0.012); gn.setTargetAtTime(0.1, t + 0.04, tr.subDecay);
      this.duck.gain.setTargetAtTime(1 - 0.3 * vel, t, 0.01); this.duck.gain.setTargetAtTime(1, t + 0.05, 0.18);
      if (bed) { bed.gain.setTargetAtTime(1 - 0.4 * vel, t, 0.01); bed.gain.setTargetAtTime(1, t + 0.05, 0.2); }
      events.push({ t, kind: 'pulse', vel });
    }

    pluck(t, vel, tr) {
      const drift = Math.pow(2, 0.8 * Math.sin(t / tr.p1) + 0.4 * Math.sin(t / tr.p2));
      const cut = clamp(tr.pcut * drift, 160, 2400);
      const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 2.5;
      f.frequency.setValueAtTime(cut * 2.2, t); f.frequency.exponentialRampToValueAtTime(cut, t + tr.pdec);
      const gn = ac.createGain(), end = t + tr.pdec * 4 + 0.2;
      gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(vel * 0.07, t + 0.008); gn.gain.setTargetAtTime(0, t + 0.015, tr.pdec / 2.5);
      for (const iv of tr.pluckNotes) for (const d of [-6, 6]) {
        const o = ac.createOscillator(); o.type = d < 0 ? 'sawtooth' : 'triangle';
        o.frequency.value = mtof(tr.base + iv); o.detune.value = d; o.connect(f); o.start(t); o.stop(end);
      }
      f.connect(gn); gn.connect(this.pluckBus);
    }

    ping(t, tr) {
      let m = tr.base + pick(tr.voicing.concat(tr.mel)) + pick([12, 24]); while (m > 86) m -= 12;
      const o = ac.createOscillator(), o2 = ac.createOscillator(), g2 = ac.createGain(), gn = ac.createGain(), dec = rnd(1.2, 2.6);
      o.type = 'sine'; o.frequency.value = mtof(m); o2.type = 'triangle'; o2.frequency.value = mtof(m) * 2.005; g2.gain.value = 0.15;
      gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(rnd(0.025, 0.05), t + 0.006); gn.gain.setTargetAtTime(0, t + 0.02, dec / 3);
      o.connect(gn); o2.connect(g2); g2.connect(gn); gn.connect(this.pingBus);
      o.start(t); o2.start(t); o.stop(t + dec * 2); o2.stop(t + dec * 2);
      events.push({ t, kind: 'ping', h: clamp((m - 60) / 26, 0, 1) });
    }

    tick(t) {
      const src = ac.createBufferSource(); src.buffer = noiseBuf;
      const hp = ac.createBiquadFilter(); hp.type = 'bandpass'; hp.frequency.value = rnd(3000, 7000); hp.Q.value = 3;
      const gn = ac.createGain(); gn.gain.setValueAtTime(rnd(0.02, 0.05), t); gn.gain.exponentialRampToValueAtTime(0.0004, t + 0.03);
      src.connect(hp); hp.connect(gn); gn.connect(this.pingBus); src.start(t, Math.random() * 1.5, 0.06);
    }
  }

  /* ---------- a piece ---------- */
  function newTrack(prevRoot) {
    const root = prevRoot == null ? Math.floor(Math.random() * 12) : (prevRoot + pick([0, 7, 5, 5, 3, 9, 10, 2])) % 12;
    const voicing = pick(VOICINGS);
    let bassBase = 36 + root; if (bassBase > 43) bassBase -= 12;
    const pat = new Array(16).fill(0); let n = 0;
    while (n < 2) for (let s = 0; s < 16; s++) if (!pat[s] && chance(0.22)) { pat[s] = rnd(0.5, 1); n++; }
    const breaks = new Set();
    for (let k = 32; k < 200; k += 16) if (chance(0.22)) { const m = pick([4, 8, 8]); for (let i = 1; i <= m; i++) breaks.add(k - i); }
    return {
      root, base: root <= 5 ? 48 + root : 36 + root, bassBase, voicing,
      mel: pick(MELS), melBars: pick([4, 8]), bass: pick(BASS),
      padCut: rnd(380, 850), padLevel: rnd(0.85, 1.1), p1: rnd(9, 17), p2: rnd(23, 37),
      hasPulse: chance(0.88), subPat: pick(SUBPATS), subDecay: rnd(0.14, 0.32), subLevel: rnd(0.75, 1),
      pluck: chance(0.7) ? rnd(0.5, 1) : 0, pluckPat: pat, pluckNotes: [voicing[1], voicing[2], pick([14, 15, 19])],
      pcut: rnd(350, 900), pdec: rnd(0.15, 0.45),
      delaySteps: pick([3, 3, 6, 4]), fb: rnd(0.4, 0.58), fbTone: rnd(1200, 2600),
      ping: rnd(0.015, 0.06), tick: chance(0.6) ? rnd(0.008, 0.04) : 0,
      wind: chance(0.75) ? rnd(0.02, 0.05) : 0, windF: rnd(300, 1200), breaks
    };
  }
  function plan() { curT = pick([12, 16, 24]); curL = pick([72, 88, 104, 120]); }

  /* ---------- clock ---------- */
  function onBar(bar, t, barDur) {
    let c = decks[cur];
    if (!c.track) { plan(); pieceNo = 1; c.load(newTrack(null), bar, t, 4, barDur, true); }
    let rel = bar - c.startBar;
    if (rel === curL) { c.end(t); cur = 1 - cur; c = decks[cur]; pieceNo++; plan(); rel = bar - c.startBar; }
    const other = decks[1 - cur];
    if (rel === curL - curT) { other.load(newTrack(c.track.root), bar, t, curT, barDur, false); c.beginOut(bar, t, curT, barDur); }
    const key = KEYS[c.track.root] + ' min' + (other.track ? ' → ' + KEYS[other.track.root] + ' min' : '');
    events.push({ t, kind: 'bar', bpm: bpmNow, key, piece: pieceNo, rel, L: curL, dur: barDur });
  }
  function tick() {
    if (!playing || !ac || ac.state !== 'running') return;
    const now = ac.currentTime;
    if (nextTime < now) nextTime = now + 0.05;
    const ahead = document.hidden ? 2.5 : 0.4;
    while (nextTime < now + ahead) {
      const el = nextTime - t0;
      bpmNow = baseBpm + 1.5 * Math.sin(el / 170) + 0.8 * Math.sin(el / 71);
      const sd = 60 / bpmNow / 4, bar = Math.floor(step / 16), s = step % 16;
      if (s === 0) onBar(bar, nextTime, sd * 16);
      decks[0].playStep(bar, s, nextTime, sd);
      decks[1].playStep(bar, s, nextTime, sd);
      nextTime += sd; step++;
    }
